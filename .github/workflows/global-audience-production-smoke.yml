name: Public Global Audience smoke checks
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check live health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS --connect-timeout 8 --max-time 15 --retry 2 \
              'https://www.behzadgh.com/api/health' | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Production API health OK"
              exit 0
            fi
            sleep 10
          done
          echo "Production API health check failed" >&2
          exit 1
      - name: Check Follow page and geographic privacy disclosure
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 8 --max-time 25 --retry 3 \
            'https://www.behzadgh.com/subscribe' > /tmp/follow.html
          grep -q 'Follow the Journey' /tmp/follow.html
          grep -q 'hosting provider may estimate' /tmp/follow.html
          echo "Follow page and geography disclosure OK"
      - name: Check public site icon
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 8 --max-time 20 --retry 3 \
            'https://www.behzadgh.com/icon.svg' | grep -q '<svg'
          echo "Site icon OK"
